<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSL Woman+</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #150c11; color: #f6dcc4;
      font-family: system-ui, sans-serif; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 22px; color: #efc4a6; }
    p { margin: 0 0 20px; line-height: 1.5; color: #d9bfae; }
    button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 24px; background: #efc4a6; color: #150c11;
      font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <!-- Первый запуск без интернета: приложение ещё ни разу не загрузилось. Дальше сайт работает и без сети сам -->
  <main>
    <h1>GSL Woman+</h1>
    <p id="t">Для первого запуску потрібен інтернет. Підключися — далі застосунок працює і без нього.</p>
    <button type="button" onclick="location.href='https://presidenta.github.io/gsl-woman/'" id="b">Спробувати ще раз</button>
  </main>
  <script>
    var l = (navigator.language || '').slice(0, 2);
    if (l === 'ru') { t.textContent = 'Для первого запуска нужен интернет. Подключись — дальше приложение работает и без него.'; b.textContent = 'Попробовать ещё раз'; }
    if (l === 'en') { t.textContent = 'The first launch needs the internet. Connect — after that the app works offline.'; b.textContent = 'Try again'; }
  </script>
</body>
</html>
